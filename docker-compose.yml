services:
  mysql:
    image: mysql:8.4
    command:
      - --innodb-print-all-deadlocks=ON
      - --performance-schema=ON
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: playsync
    # Host port comes from DB_PORT in .env (compose reads it automatically).
    # Defaults to 3307 so it doesn't collide with a locally installed MySQL on 3306.
    ports: ["${DB_PORT:-3307}:3306"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping: fails during the init phase (temporary server runs with --skip-networking),
      # so `up --wait` only returns once schema + seed have been applied.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 5s
volumes:
  mysql-data:
